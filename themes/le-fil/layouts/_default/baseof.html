<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ block "title" . }}{{ if .IsHome }}{{ site.Title }} — {{ site.Params.tagline }}{{ else }}{{ replace .Title "`" "" }} · {{ site.Title }}{{ end }}{{ end }}</title>
{{- with .Params.summary }}
<meta name="description" content="{{ replace . "`" "" }}">
{{- end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
{{- $css := slice (resources.Get "css/syntax.css") (resources.Get "css/le-fil.css") | resources.Concat "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
<div class="sheet">
{{ block "main" . }}{{ end }}
</div>
</body>
</html>
