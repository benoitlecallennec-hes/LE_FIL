# Tags of interest, in display order. A billet takes the first of its feed
# categories found in a `match` list (case-insensitive); with no hit it goes
# to `status: review`.
tags:
  - id: c
    label: C
    match: [c, c23, c2y, c2x, c17, c standard, modern c]
  - id: cpp
    label: C++
    match: [c++, cpp, c++20, c++23, c++26, c26, cpp2, cppfront, msvc, cmake, vcpkg]
  - id: 3d
    label: 3D
    match: [3d, graphics, rendering, shader, shaders, unity, blender, vulkan, opengl, webgpu, animation, geometry nodes]
  - id: git
    label: Git
    match: [git, github, gitlab, version control, source control, git workflow, merge, rebase, monorepo]
  - id: ia
    label: IA
    match: [ia, ai, artificial intelligence, intelligence artificielle, ai & ml, machine learning, deep learning, llm, llms, large language models, generative ai, generative-ai, genai, ai agents, agents, agentic ai, copilot, github copilot, claude, chatgpt]
  - id: autres
    label: Autres
    match: [software engineering, engineering, open source, open source community, maintainers, security, infrastructure, developer skills, news & insights, teaching, tools]

# rank: 1 is the most trusted. A feed with a fixed `tag` skips category
# matching: every billet it produces lands in that rubric.
feeds:
